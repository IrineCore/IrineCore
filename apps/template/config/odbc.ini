; =============================================================================
; Dragon Nest CAP 60 - Centralized DSN-less MSSQL ODBC Configuration (odbc.ini)
; =============================================================================
; Supports SQL Server 2017, 2019, 2022, 2025+ on:
;   - Windows (Local / Remote / Named Instances)
;   - Linux / Docker Containers / VPS / Cloud Remote Hosts
;
; Search order at runtime:
;   1. ./Config/odbc.ini
;   2. ./odbc.ini
;   3. <ExeDir>/Config/odbc.ini
;   4. <ExeDir>/odbc.ini
;
; [ODBC] defines global defaults shared by all DB servers (DNLoginServer,
; DNDBServer, DNCashServer, DNLogServer).
;
; You may also add optional per-database override sections named after the
; database (e.g. [DNMembership], [DNWorld], [DNLog], [DNServerLog], [DNMasterLog]).
; Any key omitted in a per-database section inherits from [ODBC], and Server /
; Port / Database / Uid fall back to the caller .ini values when left empty.
; =============================================================================

[ODBC]
; ODBC Driver name, or "Auto" to automatically probe installed SQL Server drivers
; in order:
;   1. ODBC Driver 18 for SQL Server
;   2. ODBC Driver 17 for SQL Server
;   3. ODBC Driver 13 for SQL Server
;   4. SQL Server Native Client 11.0
;   5. SQL Server Native Client 10.0
;   6. SQL Server
Driver=Auto

; Optional host/instance override. Leave empty to use DBIP/DBPort from server .ini files.
; Examples: 127.0.0.1 | sql.example.com | localhost\SQLEXPRESS | tcp:10.0.0.5,1433
Server=127.0.0.1
Port=1433

; Optional database override (normally empty; uses DBName from server .ini files)
Database=

; Authentication:
;   Trusted_Connection=No  -> Uses SQL Server authentication (Uid + Pwd)
;   Trusted_Connection=Yes -> Uses Windows Integrated Authentication (SSPI)
Trusted_Connection=No

; Leave Uid empty to use DBID from server .ini files, or set a centralized SQL login here.
Uid=DragonNest
; Custom SQL user password (required when Trusted_Connection=No).
; Special characters (; { } =) are automatically escaped by CSQLConnection.
Pwd=DnCap60!App2026

; TLS / Encryption settings (critical for ODBC Driver 18 & Linux/Docker/VPS SQL Server)
;   Encrypt: Optional | Mandatory | Strict | Yes | No
;   TrustServerCertificate: Yes (accepts self-signed/Docker certs) | No (requires trusted CA)
Encrypt=Optional
TrustServerCertificate=Yes

; Connection behavior & pooling attributes
LoginTimeout=5
ConnectionTimeout=5
MARS_Connection=No
MultiSubnetFailover=No
ApplicationName=DragonNestCap60
WorkstationID=DragonNestServer

; =============================================================================
; Optional Per-Database Overrides (uncomment any section needed)
; =============================================================================
;[DNMembership]
;Server=127.0.0.1
;Port=1433
;Uid=DragonNest
;Pwd=

;[DNWorld]
;Server=127.0.0.1
;Port=1433
;Uid=DragonNest
;Pwd=

[DNLog]
Database=dnserverlog
