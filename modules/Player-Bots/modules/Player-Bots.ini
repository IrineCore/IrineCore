; =============================================================================
; IrineCore — Player-Bots Module Configuration
; Autonomous party companion bots with level/gear/skill scaling, modular
; combat & non-combat strategies, tactical triggers/multipliers, and live
; party chat commands.
; =============================================================================

[PlayerBots]
; Enable autonomous AI party companion bots
Enabled = 1

; Exclude AI bots on Easy (0) and Normal (1) regular stages
ExcludeEasyAndNormal = 1

; Maximum AI bots summoned per party (up to 7 for 8-player raids)
MaxBotsPerParty = 7

; Auto-summon toggles for dungeons (Hard/Master/Abyss) and Nests
AutoSummonInDungeons = 1
AutoSummonInNests = 1

; Size bot squad from each stage/nest's recommended player count (rec - 1)
UseRecommendedPartySize = 1

[Scaling]
; Dynamically match bot level to the human party leader's level
SyncLevelToPlayer = 1

; Optional level offset relative to the human player (-5..+5, 0 = exact match)
LevelOffset = 0

; Clamp bot level range
MinBotLevel = 1
MaxBotLevel = 60

; Authentic Dragon Nest job progression by level:
;   Lv  1-14: Base Class (Warrior/Archer/Sorceress/Cleric/Academic/Kali)
;   Lv 15-44: 1st Specialization (Paladin/Priest/Elemental Lord/etc.)
;   Lv 45-60: 2nd Specialization (Guardian/Saint/Elestra/etc.)
UnlockJobByLevel = 1

; Automatically resync bots on stage transitions if the player leveled up or changed gear tier
ResyncOnStageTransition = 1

[Gear]
; Gear synchronization mode:
;   0 = Fixed endgame gear (legacy Lv60 Epic/Unique)
;   1 = Match human player's equipped gear tier, item level, rank & enhancement (recommended)
;   2 = Match bot level only using standard level-appropriate progression gear
GearSyncMode = 1

; Item rank offset relative to human player's average equipped rank (-2..+2)
; Ranks: 0=Normal(D), 1=Magic(C), 2=Rare(B), 3=Epic(A), 4=Unique(S), 5=Heroic(SS)
GearQualityOffset = 0
MinGearRank = 0
MaxGearRank = 5

; Match human player's average enhancement level (+0..+15)
MatchPlayerEnchant = 1
EnchantOffset = 0
MaxEnchantLevel = 12

; Match human player's equipment extras so bots stay balanced with player progression
MatchPlayerPotentials = 1
MatchPlayerCashCostumes = 1
MatchPlayerGlyphs = 1
MatchPlayerTalismans = 1

[Skills]
; Only learn skills available at the bot's synced level and unlocked job tier
SyncSkillsToLevel = 1

; Enforce skill tree parent prerequisites (TSkillTreeData::nParentSkillID)
RespectSkillPrerequisites = 1

; Skill rank scaling:
;   0     = Match human player's average skill rank investment ratio
;   1-100 = Percentage of maximum learnable skill rank at bot's level (default 100)
SkillPowerPercent = 0

; SP/MP conservation reserves (percent of max SP)
HealerManaReservePercent = 25
DpsManaConservePercent = 15

[Strategies]
; Modular strategy modifiers applied on top of each bot's role defaults (+enable, -disable)
; Combat strategies:
;   tank, healer, dps, icestack, support, aoe, burst, threat, avoid_aoe,
;   defensive, assist, focus_boss, clear_adds, save_mana, break_props, dodge_cancel
DefaultCombatStrategies = +aoe,+burst,+threat,+avoid_aoe,+assist,+save_mana,+break_props,+dodge_cancel

; Non-combat strategies:
;   follow, stay, buff, gather_gate, passive
DefaultNonCombatStrategies = +follow,+buff,+gather_gate

; Automatically adapt strategy weights inside Nests & Dragon Nests
ApplyInstanceStrategies = 1

[CombatAI]
; Combat detection and party follow ranges (world units)
AggroRange = 1500
FollowDistance = 300

; Skill pacing & human-like reaction timing (milliseconds)
GlobalSkillDelayMs = 260
ReactionJitterMs = 55

; Party heal & survival thresholds (percent HP)
HealThresholdDungeon = 75
HealThresholdNest = 82
CriticalHealThreshold = 42
SelfDefensiveHpThreshold = 35

; Avoid blowing long-cooldown skills (>12s) on low-HP normal trash mobs (percent HP)
OverkillSkipHpPercent = 18

; Soft ally separation radius (world units) to prevent clumping into boss cleaves
AllySpreadRadius = 115

; Prioritize targets engaged by the human leader & avoid pulling distant idle packs
AssistHumanLeader = 1

; Enable live party chat commands (co, nc, follow, stay, attack, passive, buff, heal, stats, reset, help)
AllowBotChatCommands = 1

; Enable concise tactical party callouts in Nests/Bosses
EnableTacticalCallouts = 1
