[PlayerBots]
; Enable autonomous human-like AI party companion bots
Enabled = 1

; Exclude AI bots on Easy (0) and Normal (1) regular stages
ExcludeEasyAndNormal = 1

; Maximum AI bots summoned per party (1..3 for 4-player stages, up to 7 for 8-player raids)
MaxBotsPerParty = 3

; Auto-summon toggles for dungeons (Hard/Master/Abyss) and Nests
AutoSummonInDungeons = 1
AutoSummonInNests = 1

; Combat detection and party follow ranges (world units)
AggroRange = 1500
FollowDistance = 300
