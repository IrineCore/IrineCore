[HeroAlly]
; Enable story hero ally accompaniment (Geraint, Argenta, Velskud) on Easy and Normal stages
Enabled = 1

; Trigger chance percentage (0..100) rolled once at Area 1 start
TriggerChancePercent = 100

; Spawn hero ally at stage start and accompany the player across multi-area progression
SpawnAtStageStart = 1
FollowAcrossAreas = 1

; Despawn the hero ally after the stage is fully cleared
DespawnOnStageClear = 1

; Story hero MonsterTable IDs
GeraintMonsterID = 236005
ArgentaMonsterID = 236003
VelskudMonsterID = 236011
