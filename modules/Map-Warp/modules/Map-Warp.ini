; =============================================================================
; IrineCore — Map-Warp Module Configuration
; =============================================================================
; Allows players to Left-Click any NPC or Portal/Gate icon on the current Zone
; Map (M key) to smart-warp safely in front of that target while facing it.
; Right-Click preserves the original auto-walk push-pin navigation behavior.
;
; All destination coordinates are resolved authoritatively on the server with
; collision, terrain/navmesh height, gate-trigger exclusion, and state checks.
; =============================================================================

[MapWarp]
; Master enable switch (1 = enabled, 0 = disabled)
Enabled = 1

; Allow smart warping in front of NPCs clicked on the Zone Map
AllowNpcWarp = 1

; Allow smart warping in front of Portals / Gates clicked on the Zone Map
AllowPortalWarp = 1

; Minimum cooldown between warps per player (milliseconds)
CooldownMs = 1500

; Send a system chat notice when a warp request is rejected (e.g., in combat / closed gate)
NotifyOnReject = 1

[Rules]
; Enable map-warp in regular towns / villages
AllowInVillage = 1

; Enable map-warp in dungeons, nests, and world zones (subject to out-of-combat & open-gate rules)
AllowInDungeon = 1

; Enable map-warp in Farm zones
AllowInFarm = 1

; Enable map-warp in PvP rooms / Colosseum village (strongly recommended: 0)
AllowInPvP = 0

; Enable map-warp in Dark Lair survival instances (recommended: 0)
AllowInDarkLair = 0

; Reject dungeon warps while any enemy monster is aggroed or nearby in combat range
RequireOutOfCombatInDungeon = 1

; Distance (world units) around the player checked for nearby hostile monsters in dungeons
CombatCheckRadius = 1000

; Require a portal/gate to be open (PermitEnter) before allowing portal warp in dungeons/world zones
RequireOpenGate = 1

[Positioning]
; Preferred distance (world units) to stand in front of an NPC
NpcFrontDistance = 110

; Preferred distance (world units) outside a portal/gate trigger box
PortalFrontDistance = 140

; Safety buffer (world units) outside gate trigger boxes so warping never force-triggers a map load
GateSafetyMargin = 90

; Maximum allowed vertical delta (world units) between target elevation and computed stand floor
MaxHeightDelta = 150
