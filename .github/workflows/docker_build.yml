name: Docker Build

on:
  push:
    branches: [ master, main, "Cap-*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ master, main, "Cap-*" ]
  workflow_dispatch:
    inputs:
      publish_ghcr:
        description: "Build and push server image to ghcr.io/irinecore/irinecore-server"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-validate:
    name: Docker Compose & Infrastructure Image Validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose manifests & GameRes override template
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.override.yml.example config --quiet
          IRINE_GAMERES_PATH=/srv/irinecore/GameRes docker compose -f docker-compose.yml config --quiet
          docker compose -f deploy/mssql/docker-compose.yml config --quiet
          docker compose -f deploy/webserver/docker-compose.yml config --quiet

      - name: Build Nginx Patch WebServer image
        run: docker build -t irinecore-webserver:ci ./deploy/webserver

      - name: Build MSSQL auto-seeded database image
        run: docker build -f deploy/mssql/Dockerfile -t irinecore-mssql:ci .

  publish-ghcr:
    name: Publish Server Image to GHCR
    needs: docker-validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr == true || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push IrineCore server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/irinecore-server:latest
            ghcr.io/${{ github.repository_owner }}/irinecore-server:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
