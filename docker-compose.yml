# =============================================================================
# IrineCore — OpenSource Dragon Nest Server Emulator
# Full Cluster Docker Compose Configuration:
#   - irine-database  : Auto-initialized SQL Server 2022 (all 5 Dragon Nest DBs)
#   - irine-webserver : Nginx Patch & Launcher HTTP server (port 80)
#   - 7 Game Cluster Daemons: Log, DB, Cash, Master, Login, Village, Game
#
# Infrastructure-only (for running native Windows/Linux env/dist binaries):
#   docker compose up -d --build irine-database irine-webserver
#
# Full containerized stack (override GameRes path via .env or
# docker-compose.override.yml — see .env.example):
#   IRINE_GAMERES_PATH=/path/to/GameRes docker compose up -d --build
# =============================================================================

x-default-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

x-server-base-volumes: &server-base-volumes
  - "${IRINE_CONFIG_PATH:-./env/dist/config}:/irinecore/env/dist/config"
  - "${IRINE_MODULE_PATH:-./env/dist/module}:/irinecore/env/dist/module"
  - "${IRINE_SYSTEMS_PATH:-./env/dist/systems}:/irinecore/env/dist/systems"
  - "${IRINE_LOGS_PATH:-./env/dist/logs}:/irinecore/env/dist/logs"

x-server-gameres-volumes: &server-gameres-volumes
  - "${IRINE_CONFIG_PATH:-./env/dist/config}:/irinecore/env/dist/config"
  - "${IRINE_MODULE_PATH:-./env/dist/module}:/irinecore/env/dist/module"
  - "${IRINE_SYSTEMS_PATH:-./env/dist/systems}:/irinecore/env/dist/systems"
  - "${IRINE_LOGS_PATH:-./env/dist/logs}:/irinecore/env/dist/logs"
  - "${IRINE_GAMERES_PATH:-./env/GameRes}:${IRINE_GAMERES_CONTAINER_PATH:-/irinecore/GameRes}:ro"

x-server-common-env: &server-common-env
  IRINE_DOCKER_NETWORK: "1"
  IRINE_DB_HOST: irine-database
  IRINE_LOG_HOST: irine-logserver
  IRINE_DB_SERVER_HOST: irine-dbserver
  IRINE_CASH_HOST: irine-cashserver
  IRINE_MASTER_HOST: irine-masterserver
  IRINE_LOGIN_HOST: irine-loginserver
  IRINE_PUBLIC_IP: "${IRINE_PUBLIC_IP:-127.0.0.1}"
  IRINE_PRIVATE_IP: "${IRINE_PRIVATE_IP:-}"
  IRINE_GAME_UDP_START_PORT: "${IRINE_GAME_UDP_START_PORT:-15100}"
  IRINE_GAMERES_CONTAINER_PATH: "${IRINE_GAMERES_CONTAINER_PATH:-/irinecore/GameRes}"
  IRINE_LOG_MAX_MB: "${IRINE_LOG_MAX_MB:-50}"
  DN_APP_USER: "${DN_APP_USER:-}"
  DN_APP_PASSWORD: "${DN_APP_PASSWORD:-}"

services:
  irine-database:
    build:
      context: .
      dockerfile: deploy/mssql/Dockerfile
    image: irinecore-mssql:2022
    container_name: irine-database
    environment:
      ACCEPT_EULA: "${ACCEPT_EULA:-Y}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-DnCap60!Local2026}"
      DN_APP_USER: "${DN_APP_USER:-DragonNest}"
      DN_APP_PASSWORD: "${DN_APP_PASSWORD:-DnCap60!App2026}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - irine-mssql-data:/var/opt/mssql
      - ./data/sql/updates:/opt/dn-init/updates:ro
      - ./modules:/opt/dn-init/modules:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /var/opt/mssql/.dn_initialized && SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S 127.0.0.1 -U sa -h -1 -W -Q \"SET NOCOUNT ON; IF (SELECT COUNT(*) FROM sys.databases WHERE state = 0 AND name IN (N'dngsm',N'dnmembership',N'dnserverlog',N'dnstaging',N'dnworld')) = 5 AND OBJECT_ID(N'dnworld.dbo.P_AddDWCCharacter',N'P') IS NOT NULL AND OBJECT_ID(N'dnworld.dbo.P_UpsEquipment',N'P') IS NOT NULL AND OBJECT_ID(N'dnmembership.dbo.Auth_ResetAuthByAccountWorld',N'P') IS NOT NULL SELECT 1 ELSE THROW 50000, 'DBs not ready', 1;\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s
    logging: *default-logging
    restart: unless-stopped

  irine-webserver:
    build:
      context: ./deploy/webserver
      dockerfile: Dockerfile
    image: irinecore-webserver:nginx
    container_name: irine-webserver
    ports:
      - "${WEBSERVER_PORT:-80}:80"
    volumes:
      - ./deploy/webserver/www:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    restart: unless-stopped

  irine-logserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-logserver
    command: ["DNLogServer64"]
    environment: *server-common-env
    depends_on:
      irine-database:
        condition: service_healthy
    volumes: *server-base-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  irine-dbserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-dbserver
    command: ["DNDBServer64"]
    environment: *server-common-env
    depends_on:
      irine-database:
        condition: service_healthy
      irine-logserver:
        condition: service_healthy
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 2600 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  irine-cashserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-cashserver
    command: ["DNCashServer64"]
    environment: *server-common-env
    depends_on:
      irine-database:
        condition: service_healthy
      irine-logserver:
        condition: service_healthy
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 12600 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  irine-masterserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-masterserver
    command: ["DNMasterServer64"]
    environment: *server-common-env
    depends_on:
      irine-logserver:
        condition: service_healthy
      irine-dbserver:
        condition: service_healthy
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8000 && nc -z 127.0.0.1 9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  irine-loginserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-loginserver
    command: ["DNLoginServer64"]
    environment: *server-common-env
    depends_on:
      irine-database:
        condition: service_healthy
      irine-masterserver:
        condition: service_healthy
    ports:
      - "${LOGIN_PORT:-14300}:14300"
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 14300 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    logging: *default-logging
    restart: unless-stopped

  irine-villageserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-villageserver
    command: ["DNVillageServer64"]
    environment: *server-common-env
    depends_on:
      irine-dbserver:
        condition: service_healthy
      irine-cashserver:
        condition: service_healthy
      irine-masterserver:
        condition: service_healthy
    ports:
      - "${VILLAGE_PORT:-14400}:14400"
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 14400 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  irine-gameserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: "${IRINE_SERVER_IMAGE:-ghcr.io/irinecore/irinecore-server:latest}"
    container_name: irine-gameserver
    command: ["DNGameServer64"]
    environment: *server-common-env
    depends_on:
      irine-dbserver:
        condition: service_healthy
      irine-cashserver:
        condition: service_healthy
      irine-masterserver:
        condition: service_healthy
    ports:
      - "${GAME_UDP_PORTS:-15100-15110}:15100-15110/udp"
    volumes: *server-gameres-volumes
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x DNGameServer64 >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 25s
    logging: *default-logging
    restart: unless-stopped

volumes:
  irine-mssql-data:
    name: irine-mssql-data
