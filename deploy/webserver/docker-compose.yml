# =============================================================================
# IrineCore — deploy/webserver/docker-compose.yml
# Standalone Nginx HTTP server for Dragon Nest launcher config and .pak patches.
# =============================================================================
services:
  webserver:
    build:
      context: .
      dockerfile: Dockerfile
    image: irinecore-webserver:nginx
    container_name: irine-webserver
    restart: unless-stopped
    ports:
      - "${WEBSERVER_PORT:-80}:80"
    volumes:
      - ./www:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
